[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "talewerk"
version = "0.1.0"
description = "An AI agent that turns a simple idea into a finished video: script, storyboard, visuals, voice and edit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Avneesh" }]
keywords = ["ai", "agent", "video-generation", "langgraph", "storyboard", "text-to-video"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.6",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/talewerk/talewerk"
Issues = "https://github.com/talewerk/talewerk/issues"

[project.scripts]
talewerk = "talewerk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/talewerk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
